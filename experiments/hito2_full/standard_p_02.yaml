seeds: [0,1,2]

preprocessing_config:
  size: 96
  mean: 0.1307
  std: 0.3081

model_config:
  hidden_dim: 1000
  out_dim: 10
  dropout:
    type: standard #"standard" | "information"
    p: 0.2
    initial_logvar: -5

train_config:
  epochs: 40
  batch_size: 128
  lr: 0.07
  optimizer: "sgd" #"adam" | "sgd"
  criterion: "cross_entropy"
  beta: 0.1
